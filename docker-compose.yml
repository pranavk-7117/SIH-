services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bhumi
      POSTGRES_USER: bhumi
      POSTGRES_PASSWORD: bhumi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumi -d bhumi"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bhumi:bhumi@db:5432/bhumi
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

